<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="brand-mark auth-brand"><span class="dot"></span>Wallet</div>
    <h1>Reset your password</h1>
    <p class="auth-sub">Enter the email on your account and we'll send you a link to set a new password.</p>

    <form id="forgotForm" class="auth-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="auth-error" id="authError" style="display:none;"></div>
      <div id="successBox" style="display:none;">
        <div class="auth-success">If an account exists for that email, a reset link has been generated.</div>
        <div class="dev-note" id="devNote" style="display:none;"></div>
      </div>
      <button type="submit" class="btn" id="submitBtn" style="width:100%;">Send reset link</button>
    </form>

    <p class="auth-switch"><a href="{{ url_for('login_page') }}">Back to sign in</a></p>
  </div>

<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('authError');
  const successBox = document.getElementById('successBox');
  const devNote = document.getElementById('devNote');
  errBox.style.display = 'none';

  const res = await fetch('/forgot-password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ email: document.getElementById('email').value })
  });
  const data = await res.json();

  if (!res.ok) {
    errBox.textContent = data.error || 'Something went wrong.';
    errBox.style.display = 'block';
    return;
  }

  successBox.style.display = 'block';
  document.getElementById('submitBtn').style.display = 'none';

  // DEV ONLY: the backend includes the reset link directly in the response
  // because this prototype has no email provider wired up. In production
  // that link is emailed instead and this block would not exist.
  if (data.dev_reset_url) {
    devNote.style.display = 'block';
    devNote.innerHTML = 'Dev mode — no email is sent, so here\'s the link directly: <a href="' + data.dev_reset_url + '">' + data.dev_reset_url + '</a>';
  }
});
</script>
</body>
</html>
