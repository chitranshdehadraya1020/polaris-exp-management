<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="brand-mark auth-brand"><span class="dot"></span>Wallet</div>
    <h1>Create your account</h1>
    <p class="auth-sub">Takes a minute. We'll set up two starter accounts and some default categories for you.</p>

    <form id="signupForm" class="auth-form">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" required autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="new-password" minlength="6">
        <div class="field-hint">At least 6 characters.</div>
      </div>
      <div class="auth-error" id="authError" style="display:none;"></div>
      <button type="submit" class="btn" style="width:100%;">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login_page') }}">Sign in</a></p>
  </div>

<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('authError');
  errBox.style.display = 'none';
  const res = await fetch('/signup', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    })
  });
  const data = await res.json();
  if (!res.ok) {
    errBox.textContent = data.error || 'Something went wrong.';
    errBox.style.display = 'block';
    return;
  }
  window.location.href = data.redirect || '/';
});
</script>
</body>
</html>
