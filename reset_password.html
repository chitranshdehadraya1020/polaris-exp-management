<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="brand-mark auth-brand"><span class="dot"></span>Wallet</div>

    {% if valid %}
      <h1>Set a new password</h1>
      <p class="auth-sub">Choose a new password for your account.</p>

      <form id="resetForm" class="auth-form">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" required autocomplete="new-password" minlength="6">
          <div class="field-hint">At least 6 characters.</div>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="6">
        </div>
        <div class="auth-error" id="authError" style="display:none;"></div>
        <button type="submit" class="btn" style="width:100%;">Update password</button>
      </form>
    {% else %}
      <h1>Link expired</h1>
      <p class="auth-sub">This reset link is invalid or has expired. Request a new one to continue.</p>
      <a class="btn" style="width:100%;display:block;text-align:center;box-sizing:border-box;" href="{{ url_for('forgot_password_page') }}">Request a new link</a>
    {% endif %}

    <p class="auth-switch"><a href="{{ url_for('login_page') }}">Back to sign in</a></p>
  </div>

{% if valid %}
<script>
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('authError');
  errBox.style.display = 'none';

  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  if (password !== confirmPassword) {
    errBox.textContent = "Passwords don't match.";
    errBox.style.display = 'block';
    return;
  }

  const res = await fetch(window.location.pathname, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ password })
  });
  const data = await res.json();
  if (!res.ok) {
    errBox.textContent = data.error || 'Something went wrong.';
    errBox.style.display = 'block';
    return;
  }
  window.location.href = data.redirect || '/login';
});
</script>
{% endif %}
</body>
</html>
